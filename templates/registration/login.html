{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'homecook/css/accounts.css' %}">
<style>
    .auth-form p {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .auth-form p label {
        margin-bottom: 0.4rem;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 4rem auto; text-align: center; padding: 0 1rem;">
    <h2 style="font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">로그인</h2>
    <p style="color: #9ca3af; margin-bottom: 2rem; font-size: 0.95rem;">Health Challenge에 오신 것을 환영합니다</p>
    <form method="post" class="auth-form">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">로그인</button>
    </form>
    <a href="{% url 'accounts:signup' %}" style="display: inline-block; margin-top: 1.5rem; color: #6b7280; font-size: 0.9rem;">아직 계정이 없으신가요? <strong style="color: #4353ff;">회원가입하기</strong></a>
</div>
{% endblock %}
