{% extends 'base.html' %}

{% block title %}오늘의 Walking{% endblock %}

{% block content %}
<style>
    .page-hero {
        background: linear-gradient(135deg, #00b894, #00cec9);
        padding: 4rem 0;
        text-align: center;
        color: white;
    }
    .page-hero .emoji { font-size: 4rem; margin-bottom: 1rem; }
    .page-hero h1 { font-size: 2.5rem; font-weight: 700; }
    .page-hero p { font-size: 1.1rem; opacity: 0.85; margin-top: 0.5rem; }
    .coming-soon {
        text-align: center;
        padding: 4rem 1rem;
        color: #636e72;
    }
    .coming-soon h2 { font-size: 1.5rem; margin-bottom: 1rem; }
    .back-btn {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 2rem;
        background: #00b894;
        color: white;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.3s;
    }
    .back-btn:hover { background: #00a381; color: white; }
</style>

<section class="page-hero">
    <div class="emoji">🚶</div>
    <h1>오늘의 Walking</h1>
    <p>걷기 챌린지로 건강을 지키세요</p>
</section>

<section class="coming-soon">
    <h2>준비 중입니다</h2>
    <p>걷기 챌린지 기능이 곧 오픈됩니다!</p>
    <a href="{% url 'homecook:main_index' %}" class="back-btn">메인으로 돌아가기</a>
</section>
{% endblock %}
